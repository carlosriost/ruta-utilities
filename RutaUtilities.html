Haz esta ronda por tu área.`,vpo_block:"Emergency Preparedness and Response",requirements:[{code:"R.1.11.1.12",title:"El dueño del territorio asume la respuesta a emergencias",detail:"Se asegura de que los equipos de respuesta a emergencias de su área sean de fácil acceso y de que las rutas de evacuación estén libres de obstáculos."}]},{id:48,phase_id:4,slug:"n3-contratistas",title:"Contratistas",description:"Integrados en las rutinas del área.",icon:"users",order_index:7,objective:"Integrar a contratistas y proveedores en las rutinas de seguridad del área.",body:`En los niveles anteriores el contratista se induce, se supervisa y se monitorea. En el nivel 3 deja de ser alguien de afuera al que se vigila y pasa a formar parte de las rutinas del área.

Eso significa que participa en las reuniones de seguridad del cuarto de equipo, en las charlas del puesto de trabajo y en la revisión de los alertas e indicadores, igual que el personal propio.

La lógica es simple: si comparten los riesgos del área, deben compartir también las conversaciones sobre cómo controlarlos.`,vpo_block:"Contractor and Service Providers Management",requirements:[{code:"R.1.12.1.17",title:"Contratistas en las rutinas del área",detail:"Los contratistas y proveedores están totalmente integrados en las rutinas de seguridad del puesto de trabajo y del cuarto de equipo del área."}]},{id:49,phase_id:4,slug:"n3-monitoreo-coaching",title:"Monitoreo y coaching",description:"Caminatas de la alta gerencia.",icon:"eye",order_index:8,objective:"Conocer el compromiso de la alta gerencia con el monitoreo en el nivel 3.",body:`El nivel 3 involucra a la alta gerencia en el terreno:

* Al menos una caminata de seguridad trimestral del equipo directivo de la planta, documentada.
* Monitoreo y coaching entre áreas, también al menos cada trimestre.

El monitoreo cruzado tiene una ventaja: alguien de otra área ve con ojos nuevos lo que en Utilities ya se volvió costumbre.`,vpo_block:"Safety Monitoring & Coaching",requirements:[{code:"R.1.16.1.10",title:"Caminatas de seguridad de la alta gerencia",detail:"El equipo directivo de la planta (director o gerente y sus reportes directos) hace y documenta al menos una caminata de seguridad cada trimestre, y la planta organiza monitoreo y coaching entre áreas al menos cada trimestre."}]},{id:50,phase_id:4,slug:"n3-cumplimiento-legal",title:"Cumplimiento legal",description:"La ley, dentro de las rutinas diarias.",icon:"scale",order_index:9,objective:"Ver cómo la ley deja de ser un documento y se vuelve rutina de trabajo.",body:`En el nivel 3 el cumplimiento legal deja de vivir en una carpeta y se integra en la forma de trabajar.

* Los líderes se forman en los requisitos legales aplicables, con foco en su responsabilidad personal si no se cumplen. Los nuevos, en sus primeros 6 meses.
* Las obligaciones legales quedan dentro de los SOP, las órdenes de trabajo, las listas de chequeo y la formación.

Cuando el sistema de órdenes de trabajo genera automáticamente la inspección de un recipiente a presión, ahí hay un requisito legal convertido en rutina.`,vpo_block:"Facility compliance",requirements:[{code:"R.1.18.1.5",title:"Formación legal para los líderes",detail:"La planta forma a los líderes en los requisitos legales que le aplican, con foco en su responsabilidad personal en caso de incumplimiento. El personal nuevo se forma dentro de sus primeros 6 meses."},{code:"R.1.18.1.6",title:"Requisitos legales dentro de las rutinas",detail:"Los requisitos legales y los de permisos y licencias están incorporados en los procesos del área y de la planta (SOP, sistema de órdenes de trabajo, listas de chequeo, formación) y se ejecutan: evaluaciones de riesgo, estudios, equipos de control, reportes, calibración, inspección y mantenimiento, monitoreo y certificaciones."}]}]},{id:5,slug:"nivel-4",name:"Referente en seguridad",description:"Nivel 4 de VPO: el equipo gestiona su propia seguridad. Nota: en la autoevaluación de la planta estos requisitos figuran como no aplicables a Utilities; se incluyen como nivel aspiracional.",order_index:4,unlock_threshold:70,theme:"teal",icon:"sparkles",nodes:[{id:51,phase_id:5,slug:"n4-seguridad-operacional",title:"Seguridad operacional",description:"El FLTM gestiona permisos y equipos de izaje.",icon:"shield",order_index:0,objective:"Pasar de verificar permisos a prepararlos y mantener los equipos.",body:`En el nivel 3 el dueño del territorio verifica los permisos. En el nivel 4 los prepara.

El salto es de control a gestión: el FLTM revisa y actualiza los procedimientos (SOP) y las lecciones de un punto (OPL) de su área, redacta los permisos de izaje y responde por los equipos completos: inspección, almacenamiento y rotulado.

Quien opera todos los días es quien mejor sabe cómo debería estar escrito el procedimiento.`,vpo_block:"Operational Safety Management",requirements:[{code:"R.1.1.2.13",title:"Toolkits de evaluación de riesgos en 80% o más",detail:"Los GOP, toolkits y tableros que apoyan la evaluación de riesgos llegan a al menos 80%, con glidepaths para cerrar las brechas."},{code:"R.1.1.9.7",title:"El FLTM gestiona la seguridad de los izajes",detail:"El FLTM revisa y actualiza los SOP y las OPL, prepara los permisos de trabajo de los izajes de su área y es dueño de los equipos de izaje: además de la inspección, su almacenamiento y su rotulado."}]},{id:52,phase_id:5,slug:"n4-procesos-alto-riesgo",title:"Procesos de alto riesgo",description:"Toolkits al 90%.",icon:"flame",order_index:1,objective:"Conocer el techo de exigencia de los toolkits de alto riesgo.",body:`El recorrido completo de los toolkits de alto riesgo marca la madurez de la planta:

* Nivel 1: 60%
* Nivel 2: 70%
* Nivel 3: 80%
* Nivel 4: 90%

Llegar al 90% en PSM NH3, SSM y ESM significa que casi todo lo que el estándar global espera de un sistema de amoníaco, de vapor y eléctrico ya está implementado y funcionando.`,vpo_block:"High Risk Processes Management",requirements:[{code:"R.1.3.1.27",title:"Toolkit PSM NH3 en 90% o más",detail:"El toolkit de amoníaco alcanza al menos 90%, con glidepaths para cerrar las brechas que queden."},{code:"R.1.3.1.29",title:"Toolkit SSM en 90% o más",detail:"El toolkit de seguridad en vapor alcanza al menos 90%, con glidepaths para cerrar brechas."},{code:"R.1.3.1.30",title:"Toolkit ESM en 90% o más",detail:"El toolkit de seguridad eléctrica alcanza al menos 90%, con glidepaths para cerrar brechas."}]},{id:53,phase_id:5,slug:"n4-ergonomia",title:"Ergonomía y cargas",description:"El FLTM propone y mide.",icon:"package",order_index:2,objective:"Pasar de aplicar las medidas a proponerlas y medir su efecto.",body:`En el nivel 3 usas las ayudas que la planta puso. En el nivel 4 propones las que faltan.

VPO espera tres cosas del FLTM:

* Proponer medidas concretas para reducir el esfuerzo y las posturas forzadas.
* Usar el mapa de riesgos ergonómicos del área para saber dónde están los puntos críticos.
* Definir y seguir indicadores que muestren si las medidas funcionaron.

Una propuesta con un indicador detrás es mucho más difícil de ignorar.`,vpo_block:"Material Handling and Ergonomics",requirements:[{code:"R.1.5.1.5",title:"Participación activa del FLTM en ergonomía",detail:"El FLTM propone medidas para reducir los riesgos de manipulación de cargas y ergonomía, usa el mapa de riesgos ergonómicos de su área y define y sigue indicadores para medir el impacto de esas medidas."}]},{id:54,phase_id:5,slug:"n4-lototo",title:"LOTOTO y máquinas",description:"Máquinas certificadas y tableros sombra.",icon:"lock",order_index:3,objective:"Reconocer el estándar de máquinas y el tablero sombra de bloqueo.",body:`El nivel 4 cierra el círculo del bloqueo con dos medidas físicas:

* Las máquinas de nivel 1 y 2 del Global Heat Map cumplen la norma global de seguridad de máquinas (GTS.GEN.SFT.GSP.007).
* Cada equipo crítico tiene su propio equipo de bloqueo en un tablero sombra: candados, tarjetas y dispositivos de aislamiento con su silueta marcada.

El tablero sombra no es orden por estética: de un vistazo se ve si falta un dispositivo, y nadie tiene que improvisar un bloqueo porque no encontró el elemento correcto.`,vpo_block:"LOTOTO and Machine Safety",requirements:[{code:"R.1.7.1.15",title:"Máquinas nivel 1 y 2 según el estándar de seguridad de máquinas",detail:"Todas las máquinas de nivel 1 y 2 del Global Heat Map cumplen la norma GTS.GEN.SFT.GSP.007 de seguridad de máquinas."},{code:"R.1.7.1.16",title:"Equipo de bloqueo específico en tableros sombra",detail:"Los equipos críticos tienen su equipo de SAM y LOTOTO específico dispuesto en tableros sombra: recipientes de cocimiento, dosificación, transferencia de materias primas, amoníaco, vapor y condensado, CO2 y N2, lavadoras y pasteurizadores, máquinas de acceso corporal en envasado, llenadoras, prensas, AGV, alta tensión y todos los espacios confinados."}]},{id:55,phase_id:5,slug:"n4-trabajo-alturas",title:"Trabajo en alturas",description:"El FLTM prepara los permisos.",icon:"mountain",order_index:4,objective:"Asumir la gestión completa del trabajo en alturas del área.",body:`Mismo salto que en izajes: del control a la gestión.

En el nivel 3 verificabas que hubiera permiso. En el nivel 4 lo preparas, mantienes al día los procedimientos de tu área y respondes por los equipos de protección contra caídas, incluido cómo se guardan y se identifican.

Un arnés bien guardado dura más y falla menos que uno colgado de un clavo.`,vpo_block:"Working at heights",requirements:[{code:"R.1.8.1.16",title:"El FLTM gestiona la seguridad del trabajo en alturas",detail:"Revisa y actualiza los SOP y las OPL, prepara los permisos de trabajo en alturas de su área y es dueño de los equipos: además de la inspección, su almacenamiento y su rotulado."}]},{id:56,phase_id:5,slug:"n4-espacios-confinados",title:"Espacios confinados",description:"Procedimientos y permisos desde el área.",icon:"cylinder",order_index:5,objective:"Gestionar los procedimientos y equipos de entrada del área.",body:`En el nivel 2 cada espacio confinado recibió su procedimiento propio. En el nivel 4 ese procedimiento lo mantiene quien trabaja en el área.

El FLTM revisa y actualiza los SOP y las OPL, prepara los permisos de entrada y responde por los equipos de entrada y rescate: medidores, ventilación, trípodes y arneses, incluido cómo se guardan y se rotulan.

Nadie conoce mejor las trampas de un tanque que quien lo abre cada parada.`,vpo_block:"Confined Spaces",requirements:[{code:"R.1.10.1.9",title:"El FLTM gestiona la seguridad de los espacios confinados",detail:"Revisa y actualiza los SOP y las OPL, prepara los permisos de entrada de su área y es dueño de los equipos de espacios confinados: además de la inspección, su almacenamiento y su rotulado."}]},{id:57,phase_id:5,slug:"n4-emergencias",title:"Emergencias",description:"Procedimientos y equipos del área.",icon:"siren",order_index:6,objective:"Mantener vivos los procedimientos y equipos de emergencia del área.",body:`En el nivel 3 recorrías tu área para comprobar que los extintores estuvieran despejados y las rutas libres. En el nivel 4 eres dueño de la inspección de esos equipos y mantienes al día los procedimientos.

Eso significa que cuando cambia algo en tu área (una línea nueva, un tanque que se mueve, una ruta que se modifica), el procedimiento de emergencia se actualiza contigo, no meses después.

Un plan de emergencia desactualizado es peligroso justo por ser creíble: la gente confía en él.`,vpo_block:"Emergency Preparedness and Response",requirements:[{code:"R.1.11.1.14",title:"El FLTM gestiona la respuesta a emergencias del área",detail:"Revisa y actualiza los SOP y las OPL de respuesta a emergencias y es dueño de la inspección de los equipos de emergencia de su área."}]},{id:58,phase_id:5,slug:"n4-monitoreo-coaching",title:"Monitoreo y coaching",description:"Observación entre pares y tecnología.",icon:"eye",order_index:7,objective:"Entender la observación entre pares y el papel de la tecnología.",body:`Hasta el nivel 3, quien observa es el líder. En el nivel 4 el FLTM se observa entre pares: al menos el 40% del equipo formado en observación de comportamientos (SBO) y coaching.

Es un cambio grande de cultura. Que un compañero te diga 'oye, así te puedes lastimar' funciona distinto a que te lo diga el jefe, y el monitoreo del área pasa a ser del propio equipo.

A esto se suma la tecnología (cámaras inteligentes, telemetría, sensores corporales, drones, sensores de presencia), siempre con el mismo propósito: detectar la brecha antes de que se convierta en un incidente.`,vpo_block:"Safety Monitoring & Coaching",requirements:[{code:"R.1.16.1.11",title:"Observación entre pares y monitoreo del FLTM",detail:"Hay un programa documentado de observación de comportamientos (SBO) y coaching entre pares del FLTM, con al menos el 40% del FLTM formado, y el monitoreo de seguridad del área lo asume el propio FLTM."},{code:"R.1.16.1.12",title:"Tecnología para el monitoreo de seguridad",detail:"Se usa tecnología para capturar, documentar y gestionar condiciones inseguras y comportamientos seguros e inseguros: cámaras inteligentes o CCTV, telemetría, sensores corporales, drones, robots de detección y sensores de presencia. El objetivo es trabajar de forma proactiva, identificando brechas antes de que ocurra el incidente."}]},{id:59,phase_id:5,slug:"n4-cultura-seguridad",title:"Cultura de seguridad",description:"Política aplicada, factores humanos y territorios.",icon:"handshake",order_index:8,objective:"Aplicar la política en la rutina y reconocer los factores humanos.",body:`El nivel 4 es el de la cultura: la seguridad deja de ser un conjunto de reglas y se vuelve la forma normal de trabajar.

Tres señales de que se llegó:

* Cualquiera puede explicar cómo aplica la Política Global en su turno: sin atajos, todos somos líderes en seguridad.
* Los líderes tienen en cuenta los factores humanos: fatiga, estrés, falta de experiencia, formación insuficiente, supervisión deficiente o problemas personales.
* Al menos el 80% de los territorios llegó al nivel 3 de seguridad territorial.`,vpo_block:"Behavioral Safety Culture",requirements:[{code:"R.1.17.9.9",title:"El FLTM se apropia de la Política Global de Seguridad",detail:"El FLTM demuestra cómo aplica la Política Global en su rutina diaria y puede responder: cómo contribuye a eliminar la exposición al riesgo, cómo ayuda VPO a mejorar la seguridad, qué significa que todos somos líderes en seguridad y qué significa no tomar atajos."},{code:"R.1.17.9.11",title:"Concepto de factores humanos aplicado",detail:"Los líderes usan el concepto de factores humanos en su rutina: cualquier característica de una persona que afecte su capacidad de hacer una tarea de forma segura, como fatiga, estrés, falta de experiencia, formación insuficiente, supervisión deficiente o problemas personales."},{code:"R.1.17.9.12",title:"Seguridad territorial en nivel 3",detail:"Al menos el 80% de los territorios alcanza como mínimo el nivel 3 de seguridad territorial, evaluado con los criterios globales."}]},{id:60,phase_id:5,slug:"n4-cumplimiento-legal",title:"Cumplimiento legal",description:"El FLTM conoce lo que le aplica.",icon:"scale",order_index:9,objective:"Cerrar el recorrido sabiendo qué exige la ley en tu área.",body:`El cumplimiento legal recorrió todo el mapa: en el nivel 0 la planta identifica qué leyes le aplican, en el 1 las mantiene al día, en el 3 forma a los líderes y las mete en las rutinas.

En el nivel 4 llega hasta el final de la línea: cada integrante del equipo sabe, por formación, cuáles son los principales requisitos legales de seguridad y salud que aplican a su trabajo y a su área.

Es el cierre natural de la ruta: ya no se cumple porque alguien revisa, sino porque el equipo sabe qué se espera y por qué.`,vpo_block:"Facility compliance",requirements:[{code:"R.1.18.1.7",title:"El FLTM conoce los requisitos legales de su área",detail:"El FLTM tiene, por formación, conocimiento de los principales requisitos legales de seguridad y salud en el trabajo que le aplican a él y a su área."}]}]}],badges:[{id:1,slug:"primer-paso",name:"Primer paso",description:"Marcaste tu primer tema como cumplido.",icon:"rocket",theme:"mint",rule_type:"FIRST_REQUIREMENT_MET",rule_ref:null},{id:2,slug:"cimientos-vpo",name:"Cimientos VPO",description:"El nivel 0 cumple el 100% de sus temas.",icon:"shield",theme:"mint",rule_type:"PHASE_COMPLIANT",rule_ref:"nivel-0"},{id:3,slug:"control-del-riesgo",name:"Control del riesgo",description:"El nivel 1 alcanza el 90% de cumplimiento.",icon:"gauge",theme:"sky",rule_type:"PHASE_COMPLIANT",rule_ref:"nivel-1"},{id:4,slug:"gestion-proactiva",name:"Gestión proactiva",description:"El nivel 2 alcanza el 80% de cumplimiento.",icon:"target",theme:"amber",rule_type:"PHASE_COMPLIANT",rule_ref:"nivel-2"},{id:5,slug:"duenos-del-territorio",name:"Dueños del territorio",description:"El nivel 3 alcanza el 70% de cumplimiento.",icon:"handshake",theme:"grape",rule_type:"PHASE_COMPLIANT",rule_ref:"nivel-3"},{id:6,slug:"maestro-utilities",name:"Maestro Utilities",description:"Los cinco niveles alcanzan su umbral de cumplimiento.",icon:"trophy",theme:"teal",rule_type:"COURSE_COMPLIANT",rule_ref:null}]},cy="Completa el nivel anterior para desbloquear esta zona.",dy="ruta-utilities.marcas.v3",hr=Sb,wb=hr.phases.flatMap(e=>e.nodes),xi=()=>({metCodes:[],badges:{},announced:[],started_at:null});let gr=null,dc=!0;function yr(){if(gr)return gr;try{const e=window.localStorage.getItem(dy);gr=e?{...xi(),...JSON.parse(e)}:xi()}catch{dc=!1,gr=xi()}return gr}function py(e){gr=e;try{window.localStorage.setItem(dy,JSON.stringify(e))}catch{dc=!1}}function bb(){return
